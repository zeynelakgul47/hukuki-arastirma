[project]
name = "hukuki-arastirma"
version = "0.1.0"
description = "Kişisel hukuki araştırma MCP: içtihat (Bedesten) + güncel mevzuat + yerel cache"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Zeynel Abidin Akgül"}]
dependencies = [
    "beautifulsoup4>=4.13.4",
    "httpx>=0.28.1",
    "markitdown[pdf]>=0.1.1",
    "pydantic>=2.11.4,<2.12",
    "aiohttp>=3.11.18",
    "fastmcp==2.13.3",
    "mcp==1.22.0",
    "pypdf>=5.5.0",
    "fastapi>=0.115.14",
    "cryptography>=44.0.0",
    "openai>=1.0.0",
    "numpy>=1.24.0",
    "lxml>=4.9.0",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.30.0",
    "starlette>=0.37.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
hukuki-mcp = "hukuki_mcp.server:main"
hukuki-mcp-http = "hukuki_mcp.asgi:run_http"

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["hukuki_mcp*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
